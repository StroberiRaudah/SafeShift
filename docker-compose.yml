# Local SQL Server for development (backup to the shared Azure SQL database).
# Start:  docker compose up -d      Stop: docker compose stop
# The SA password comes from the .env file next to this one (never committed).
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: safeshift-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql   # keeps the data when the container is removed
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqldata:
